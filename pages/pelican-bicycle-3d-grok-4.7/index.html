<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑车 · grok-4.7</title>
  <meta name="description" content="一只美洲白鹈鹕在黄昏的海岸沙路上骑自行车。程序化三维，无需构建。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle fill='%231b4636' cx='16' cy='16' r='16'/%3E%3Cpath fill='%23f6f3ee' d='M8 18c2-6 6-8 8-8s6 2 8 8c-3 1-5 2-8 2s-5-1-8-2z'/%3E%3Cpath fill='%23f08a3c' d='M16 16l8-1-1 2z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <header id="mast">
    <p class="kicker">海岸速写 · grok-4.7</p>
    <h1>鹈鹕骑车</h1>
    <p id="flavor">白鹈鹕，初级飞羽是黑的。车速是它自己的事。</p>
  </header>
  <section id="hud" aria-live="polite">
    <p id="cam">跟随</p>
    <p class="speed"><span id="spd">0</span><i>公里/时</i></p>
  </section>
  <ul id="help">
    <li><kbd>W</kbd> 蹬 · <kbd>S</kbd> 刹 · <kbd>A</kbd><kbd>D</kbd> 转</li>
    <li><kbd>Shift</kbd> 冲刺 · <kbd>空格</kbd> 铃 · <kbd>F</kbd> 振翅</li>
    <li><kbd>V</kbd> 叫 · <kbd>C</kbd> 镜头 · <kbd>N</kbd> 入夜</li>
    <li><kbd>R</kbd> 回到沙路 · <kbd>O</kbd> 隐藏界面</li>
  </ul>
  <div id="intro">
    <p>沙路是椭圆的，喙是向前的。</p>
    <button id="ride" type="button">握住车把</button>
    <p class="sub">或按任意键 · 海声会跟着醒来</p>
  </div>
  <p id="boot">正在铺沙、装轮辐、把蹼放上脚踏。</p>
  <div id="touch">
    <button type="button" id="t-left" aria-label="左转">←</button>
    <button type="button" id="t-go" aria-label="蹬车">蹬</button>
    <button type="button" id="t-right" aria-label="右转">→</button>
    <button type="button" id="t-bell" aria-label="车铃">铃</button>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
