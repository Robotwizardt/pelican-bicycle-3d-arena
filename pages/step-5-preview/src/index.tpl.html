<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<meta name="description" content="鹈鹕骑行 3D · 一只戴骑行帽的鹈鹕骑着自行车穿过海岸公路的实时 3D 场景">
<meta property="og:title" content="鹈鹕骑行 3D · Pelican Ride 3D">
<meta property="og:description" content="实时渲染的 3D 场景：鹈鹕骑自行车，可调速度、时间段与视角">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<title>鹈鹕骑行 3D · Pelican Ride 3D</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<div id="stage"></div>

<header id="topbar">
  <div class="brand">
    <div class="logo">🚲</div>
    <div>
      <h1>鹈鹕骑行<span>PELICAN RIDE 3D</span></h1>
      <p>一只戴骑行帽的鹈鹕，正沿着海风公路慢慢蹬车 —— 拖动旋转视角，滚轮缩放</p>
    </div>
  </div>
  <div id="hud">
    <div class="gauge">
      <svg viewBox="0 0 124 70" aria-hidden="true">
        <defs>
          <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2fb8a6"/><stop offset=".55" stop-color="#ffc14d"/><stop offset="1" stop-color="#f2643f"/>
          </linearGradient>
        </defs>
        <path d="M12 62 A50 50 0 0 1 112 62" fill="none" stroke="rgba(19,33,46,.12)" stroke-width="9" stroke-linecap="round"/>
        <path d="M12 62 A50 50 0 0 1 112 62" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="30" id="gaugeArc"/>
        <g id="gaugeTicks" stroke="rgba(19,33,46,.4)" stroke-width="1.6"></g>
        <g id="gaugeNeedle" transform="rotate(-120 62 62)">
          <line x1="62" y1="62" x2="104" y2="62" stroke="#f2643f" stroke-width="3" stroke-linecap="round"/>
          <circle cx="62" cy="62" r="4.6" fill="#1b2836"/>
        </g>
      </svg>
      <div class="num"><span id="spdNum">0</span><small>km/h</small></div>
      <div class="lab">速 度</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="distNum">0.00</b><i>里程 KM</i></div>
      <div class="stat"><b id="cadNum">0</b><i>踏频 RPM</i></div>
      <div class="stat"><b id="timeName">正午</b><i>时间段</i></div>
    </div>
  </div>
</header>

<aside id="panel">
  <div class="grp">
    <label>骑行速度 <span class="val" id="spdVal">18 km/h</span></label>
    <input type="range" id="speed" min="0" max="60" step="1" value="18">
  </div>
  <div class="grp">
    <div class="cap">时间段 <span class="val" id="todVal">正午</span></div>
    <div class="chips" id="todChips">
      <button class="chip on" data-tod="noon">正午</button>
      <button class="chip" data-tod="golden">黄金</button>
      <button class="chip" data-tod="sunset">日落</button>
      <button class="chip" data-tod="night">夜晚</button>
    </div>
  </div>
  <div class="grp">
    <div class="cap">车身涂装 <span class="val" id="liveryVal">珊瑚红</span></div>
    <div class="swatches" id="livery"></div>
  </div>
  <div class="grp">
    <div class="cap">视角</div>
    <div class="chips" id="camChips">
      <button class="chip on" data-cam="orbit">自由</button>
      <button class="chip" data-cam="side">侧面</button>
      <button class="chip" data-cam="front">正面</button>
      <button class="chip" data-cam="chase">跟随</button>
      <button class="chip" data-cam="top">俯视</button>
    </div>
  </div>
  <div class="grp toggles">
    <div class="tg on" data-tg="autoRotate"><span>自动环绕</span><span class="sw2"></span></div>
    <div class="tg on" data-tg="shadows"><span>实时阴影</span><span class="sw2"></span></div>
    <div class="tg" data-tg="wireframe"><span>线框模式</span><span class="sw2"></span></div>
    <div class="tg" data-tg="sound"><span>音效（铃声）</span><span class="sw2"></span></div>
  </div>
  <div class="btns">
    <button class="btn warm" id="btnBell">🔔 按铃</button>
    <button class="btn" id="btnPhoto">📷 拍照</button>
    <button class="btn" id="btnReset">↺ 重置</button>
    <button class="btn" id="btnFull">⛶ 全屏</button>
  </div>
</aside>
<button id="panelToggle" title="显示控制面板">⚙</button>

<div id="hint">
  <span>🖱 拖动旋转</span><span>滚轮缩放</span><span>A / D 转向</span><span>W / S 速度</span><span>空格 按铃</span><span>1-4 时间段</span><span>R 重置</span>
</div>

<div id="touch">
  <div class="pad">
    <button class="tbtn" data-key="left">◀</button>
    <button class="tbtn" data-key="right">▶</button>
  </div>
  <div class="pad">
    <button class="tbtn bell" id="btnBellTouch">🔔</button>
  </div>
</div>

<div id="toast"></div>

<div id="loader">
  <div class="ld">
    <div class="bird">🚲</div>
    <h2>鹈鹕骑行 3D</h2>
    <div class="bar"><i id="ldBar"></i></div>
    <p id="ldMsg">正在唤醒鹈鹕…</p>
  </div>
</div>

<div id="fallback"><div>
  <h2>😢 无法启动 3D 场景</h2>
  <p>当前浏览器不支持 WebGL。请尝试使用最新版 Chrome / Edge / Safari，并确认已开启硬件加速。</p>
</div></div>

<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
