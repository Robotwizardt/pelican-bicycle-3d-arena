<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A pelican riding a bicycle — fully procedural 3D scene built with Three.js, no build step." />
<meta name="theme-color" content="#0b1622" />
<title>Pelican on a Bicycle · 3D Arena</title>

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Pelican on a Bicycle · 3D Arena" />
<meta property="og:description" content="一只骑自行车的鹈鹕 —— 纯程序化建模 + 逐顶点动画 + 自定义 GLSL 海面着色器。" />
<meta property="og:image" content="assets/textures/hero-sunset-pelican-bicycle.png" />

<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/utils/BufferGeometryUtils.js": "./vendor/BufferGeometryUtils.relative.js",
    "three/addons/utils/SkeletonUtils.js": "./vendor/SkeletonUtils.js"
  }
}
</script>
</head>
<body>

<!-- 加载遮罩 -->
<div id="loader" aria-hidden="true">
  <div class="loader-inner">
    <div class="loader-pelican">🦩</div>
    <div class="loader-text">正在组装鹈鹕的自行车…</div>
    <div class="loader-bar"><span id="loader-fill"></span></div>
  </div>
</div>

<!-- 英雄区 -->
<header class="hero">
  <img class="hero-bg" src="assets/textures/hero-sunset-pelican-bicycle.png" alt="" aria-hidden="true" />
  <div class="hero-scrim"></div>
  <div class="hero-content">
    <p class="hero-kicker">3D ARENA · MODEL: KIMI-K2.8-PREVIEW</p>
    <h1 class="hero-title">一只骑自行车的鹈鹕</h1>
    <p class="hero-sub">纯程序化建模 · 逐顶点骨骼动画 · 自定义 GLSL 海面 · Web Audio 合成音效</p>
    <button id="enter-btn" class="hero-cta">进入 3D 场景 ↓</button>
  </div>
</header>

<!-- 3D 舞台 -->
<main id="arena" class="arena">
  <div id="canvas-wrap" class="canvas-wrap">
    <canvas id="scene-canvas"></canvas>

    <!-- HUD -->
    <div class="hud hud-top">
      <button class="hud-btn" id="wire-toggle" title="线框模式">◈ 线框</button>
      <button class="hud-btn" id="auto-orbit" title="自动环绕">⟳ 环绕</button>
      <button class="hud-btn" id="day-night" title="昼夜切换">☾ 夜晚</button>
      <button class="hud-btn" id="sound-btn" title="声音">🔇 声音</button>
    </div>

    <div class="hud hud-bottom">
      <div class="readout">
        <div class="readout-row"><span>速度</span><strong id="ro-speed">0.0 m/s</strong></div>
        <div class="readout-row"><span>踏频</span><strong id="ro-cadence">0 rpm</strong></div>
        <div class="readout-row"><span>里程</span><strong id="ro-dist">0.00 km</strong></div>
      </div>
      <input id="speed-slider" class="speed-slider" type="range" min="0" max="14" step="0.1" value="5" aria-label="骑行速度" />
      <div class="hint">拖动滑块调速 · 点击鹈鹕它会叫 · 空格键捏闸</div>
    </div>

    <div id="toast" class="toast"></div>
  </div>
</main>

<!-- 画廊区 -->
<section class="gallery">
  <h2 class="gallery-title">画廊</h2>
  <p class="gallery-sub">场景里的贴图与彩蛋</p>
  <div class="gallery-grid">
    <figure class="gallery-card" tabindex="0" data-lightbox="assets/textures/hero-sunset-pelican-bicycle.png">
      <img src="assets/textures/hero-sunset-pelican-bicycle.png" alt="英雄区落日鹈鹕" loading="lazy" />
      <figcaption>英雄区主视觉（AI 生成）</figcaption>
    </figure>
    <figure class="gallery-card" tabindex="0" data-lightbox="assets/textures/pelican-canvas-painting.jpg">
      <img src="assets/textures/pelican-canvas-painting.jpg" alt="场景内画廊挂画：油画鹈鹕" loading="lazy" />
      <figcaption>场景内画廊挂画 · 点击放大</figcaption>
    </figure>
    <figure class="gallery-card" tabindex="0" data-lightbox="assets/textures/pelican-normal-map.jpg">
      <img src="assets/textures/pelican-normal-map.jpg" alt="鹈鹕羽毛法线贴图" loading="lazy" />
      <figcaption>鹈鹕羽毛法线贴图</figcaption>
    </figure>
    <figure class="gallery-card" tabindex="0" data-lightbox="assets/textures/wood-plank-texture.jpg">
      <img src="assets/textures/wood-plank-texture.jpg" alt="木板路贴图" loading="lazy" />
      <figcaption>木板路贴图</figcaption>
    </figure>
  </div>
</section>

<!-- 灯箱 -->
<div id="lightbox" class="lightbox" aria-hidden="true">
  <img id="lightbox-img" src="" alt="" />
  <button id="lightbox-close" class="lightbox-close" aria-label="关闭">✕</button>
</div>

<!-- 传送带：Three.js 加载并初始化完毕后才显示 -->
<div id="scroll-sentinel"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
