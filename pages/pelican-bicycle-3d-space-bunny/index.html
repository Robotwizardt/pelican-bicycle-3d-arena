<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1622">
  <meta name="description" content="灯塔邮路 · 鹈鹕骑自行车 — 程序化 3D 互动场景（Three.js），零外部素材。">
  <title>灯塔邮路 · 鹈鹕骑自行车 | Pelican Post</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pre">
  <!-- 3D 画布 -->
  <canvas id="scene"></canvas>

  <!-- 加载遮罩 -->
  <div id="loading" class="overlay-slim">
    <div class="spinner"></div>
    <div class="loading-text">正在生成海岬与鹈鹕…</div>
  </div>

  <!-- HUD -->
  <div id="hud" aria-live="polite">
    <!-- 左上：品牌 + 读数 -->
    <div class="panel panel-brand" id="brand">
      <div class="brand-title">灯塔邮路<span class="brand-en">PELICAN POST</span></div>
      <div class="brand-sub">白鹈鹕 × 邮政自行车 · 海岬环岛邮路</div>
      <div class="readouts">
        <div class="ro"><span class="ro-val" id="speedVal">0</span><span class="ro-unit">km/h</span><span class="ro-key">速度</span></div>
        <div class="ro"><span class="ro-val" id="cadenceVal">0</span><span class="ro-unit">rpm</span><span class="ro-key">踏频</span></div>
        <div class="ro"><span class="ro-val" id="odoVal">0</span><span class="ro-unit">m</span><span class="ro-key">里程</span></div>
        <div class="ro"><span class="ro-val" id="lapVal">0</span><span class="ro-unit">圈</span><span class="ro-key">环岛</span></div>
        <div class="ro"><span class="ro-val" id="bagVal">0</span><span class="ro-unit">件</span><span class="ro-key">投递</span></div>
        <div class="ro"><span class="ro-val" id="fishVal">0</span><span class="ro-unit">条</span><span class="ro-key">渔获</span></div>
      </div>
    </div>

    <!-- 右上：控制 -->
    <div class="panel panel-ctrl">
      <div class="ctrl-row">
        <span class="tag">相机</span>
        <span class="tagval" id="camVal">追尾跟拍</span>
        <button id="btnCam" class="icon-btn" title="切换相机 (C)">🎥</button>
      </div>
      <div class="ctrl-row">
        <span class="tag">时刻</span>
        <span class="tagval mono" id="clockVal">17:24</span>
        <span class="tagval" id="moodVal">黄金时刻</span>
      </div>
      <div class="ctrl-row">
        <span class="tag">天气</span>
        <span class="tagval" id="weatherVal">晴</span>
        <span class="tag">风</span>
        <span class="tagval mono" id="windVal">45</span>
      </div>
      <div class="chip-row" id="weatherRow"></div>
      <div class="ctrl-row">
        <label class="slider-label" for="timeSlider">时间轴</label>
        <input id="timeSlider" class="slider" type="range" min="0" max="23.9" step="0.05" value="17.4">
        <button id="btnAuto" class="chip">⏱ 自动</button>
      </div>
      <div class="ctrl-row">
        <label class="slider-label" for="windSlider">风力</label>
        <input id="windSlider" class="slider" type="range" min="0" max="100" step="1" value="45">
        <button id="btnMute" class="icon-btn" title="静音">🔊</button>
        <select id="qualitySel" class="select" title="画质">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>
      </div>
      <div class="ctrl-row">
        <button id="btnDrive" class="chip wide">🎮 手动驾驶 (M)</button>
        <button id="btnFlight" class="chip wide">🕊 盘旋灯塔 (F)</button>
      </div>
    </div>

    <!-- 左下：冷知识 -->
    <div class="panel panel-fact" id="factCard"></div>

    <!-- 底部：操作提示 -->
    <div class="panel panel-keys">
      <span><b>W/S</b> 加速</span><span><b>空格</b> 刹车</span><span><b>C</b> 相机</span>
      <span><b>M</b> 手动</span><span><b>F</b> 盘旋</span><span><b>[ ]</b> 天气</span>
      <span><b>, .</b> 时刻</span><span><b>P</b> 隐藏UI</span>
    </div>

    <!-- 中央吐司 -->
    <div id="toast" class="toast"></div>
  </div>

  <!-- 开场遮罩 -->
  <div id="overlay" class="overlay">
    <div class="hero">
      <div class="hero-kicker">程序化 3D · Three.js · 零外部素材</div>
      <h1 class="hero-title">灯塔邮路<br><span class="hero-sub">鹈鹕骑自行车</span></h1>
      <p class="hero-desc">
        一只大白鹈鹕，踩着<b>全蹼足</b>，蹬着邮政自行车，沿着黄金时刻的海岬环岛送报。<br>
        海浪、天空、羽翼、渔获、灯塔光束，全部在你的浏览器里实时生成。
      </p>
      <button id="startBtn" class="cta">开始投递 →</button>
      <div class="hero-foot">点击后开启环境音（海浪 / 风 / 车轮 / 鹈鹕）</div>
    </div>
  </div>

  <script src="js/bundle.js"></script>
</body>
</html>
