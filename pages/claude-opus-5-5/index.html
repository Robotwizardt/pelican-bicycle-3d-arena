<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>鹈鹕骑自行车 · Pelican on a Bicycle · 3D</title>
  <meta name="description" content="一只戴头盔、系围巾的鹈鹕骑着复古自行车绕池塘兜圈的程序化 3D 场景。Three.js · 昼夜循环 · IK 踩踏 · WebAudio 合成音效。由 Claude Opus 5.5 生成。" />
  <meta property="og:title" content="鹈鹕骑自行车 · 3D" />
  <meta name="theme-color" content="#0f1a2a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>" />
  <style>
    :root { --glass: rgba(14, 22, 36, 0.55); --line: rgba(255, 255, 255, 0.14); --fg: #f4f1ea; --accent: #ffc14d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1a2a; color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; background: var(--glass); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); transition: opacity .4s, transform .4s; }
    #title { top: 16px; left: 16px; padding: 12px 16px; max-width: min(420px, calc(100vw - 32px)); }
    #title h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
    #title h1 span { color: var(--accent); }
    #title p { margin: 4px 0 0; font-size: 12.5px; opacity: .8; line-height: 1.5; }
    #hud { bottom: 16px; left: 16px; padding: 10px 14px; display: grid; grid-template-columns: repeat(5, auto); gap: 4px 18px; font-variant-numeric: tabular-nums; }
    #hud div { display: flex; flex-direction: column; }
    #hud b { font-size: 22px; font-weight: 650; }
    #hud small { font-size: 11px; opacity: .7; }
    #controls { bottom: 16px; right: 16px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 32px)); justify-content: flex-end; }
    button { font: inherit; font-size: 13.5px; color: var(--fg); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; cursor: pointer; transition: background .2s, transform .1s; min-height: 38px; user-select: none; -webkit-user-select: none; }
    button:hover { background: rgba(255, 255, 255, .18); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #keys { top: 16px; left: 50%; transform: translateX(-50%); padding: 6px 12px; font-size: 12px; opacity: .85; white-space: nowrap; }
    kbd { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; font-size: 11px; background: rgba(255, 255, 255, .06); font-family: inherit; }
    #toast { position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%) scale(.9); padding: 10px 18px; border-radius: 30px; background: rgba(0, 0, 0, .55); font-size: 16px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #243b5a, #0b1220); z-index: 10; transition: opacity .9s ease; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .wheel { width: 64px; height: 64px; border: 4px solid #cfd6e2; border-radius: 50%; position: relative; margin: 0 auto 14px; animation: spin 1s linear infinite; }
    #loader .wheel::before, #loader .wheel::after { content: ""; position: absolute; inset: 50% 4px auto; height: 2px; background: #cfd6e2; }
    #loader .wheel::after { transform: rotate(90deg); }
    #loader p { text-align: center; opacity: .85; margin: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lil-gui.root { position: fixed; top: 16px; right: 16px; --background-color: rgba(14, 22, 36, .72); --title-background-color: rgba(10, 16, 28, .85); --widget-color: rgba(255, 255, 255, .12); --focus-color: rgba(255, 255, 255, .22); --number-color: #ffc14d; --font-family: inherit; border-radius: 12px; overflow: hidden; backdrop-filter: blur(10px); }
    @media (max-width: 760px) { .lil-gui.root { top: auto; bottom: 172px; right: 12px; max-height: 34vh; overflow-y: auto; } }
    body.hide-ui .panel { opacity: 0; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    @media (max-width: 760px) {
      #keys { display: none; }
      #hud { grid-template-columns: repeat(3, auto); bottom: auto; top: 108px; }
      #hud .opt { display: none; }
      #title h1 { font-size: 17px; }
      #controls { left: 12px; right: 12px; bottom: 12px; max-width: none; justify-content: center; }
      button { padding: 8px 9px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 3s !important; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="loader" role="status" aria-live="polite"><div><div class="wheel" aria-hidden="true"></div><p>鹈鹕正在给轮胎打气…</p></div></div>
  <main id="app"></main>

  <header id="title" class="panel">
    <h1>🐦 鹈鹕骑自行车 <span>3D</span></h1>
    <p>程序化建模 · 两骨 IK 踩踏与握把 · 昼夜循环 · 物理天空 · 辉光后期 · 合成音效<br />点击鹈鹕让它大叫，点击自行车按铃。Generated by <b>Claude Opus 5.5</b></p>
  </header>

  <div id="keys" class="panel" aria-hidden="true">
    <kbd>↑</kbd><kbd>↓</kbd> 加减速 · <kbd>空格</kbd> 滑行 · <kbd>B</kbd> 铃 · <kbd>Q</kbd> 叫 · <kbd>C</kbd> 相机 · <kbd>N</kbd> 昼夜 · <kbd>M</kbd> 声音 · <kbd>P</kbd> 截图 · <kbd>H</kbd> 隐藏
  </div>

  <section id="hud" class="panel" aria-label="骑行数据">
    <div><b id="hud-speed">0.0</b><small>km/h</small></div>
    <div><b id="hud-cadence">0</b><small>踏频 rpm</small></div>
    <div><b id="hud-time">--:--</b><small>当地时间</small></div>
    <div class="opt"><b id="hud-dist">0.00</b><small>里程 km</small></div>
    <div class="opt"><b id="hud-fps">--</b><small>FPS</small></div>
  </section>

  <nav id="controls" class="panel" aria-label="操作">
    <button id="btn-slower" aria-label="减速（按住）">🐢 减速</button>
    <button id="btn-faster" aria-label="加速（按住）">🐇 加速</button>
    <button id="btn-coast" aria-label="滑行（按住）">🛼 滑行</button>
    <button id="btn-bell" aria-label="按车铃">🔔 车铃</button>
    <button id="btn-squawk" aria-label="让鹈鹕大叫">🗯️ 大叫</button>
    <button id="btn-cam" aria-label="切换相机">🎥 相机</button>
    <button id="btn-night" aria-label="切换昼夜">🌗 昼夜</button>
    <button id="btn-sound" aria-pressed="false" aria-label="开关声音">🔇 声音关</button>
    <button id="btn-shot" aria-label="保存截图">📸 截图</button>
    <button id="btn-ui" aria-label="隐藏界面，按 H 恢复">🙈 隐藏</button>
  </nav>

  <div id="toast" aria-hidden="true"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center">需要启用 JavaScript 才能查看 3D 场景。</p></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
