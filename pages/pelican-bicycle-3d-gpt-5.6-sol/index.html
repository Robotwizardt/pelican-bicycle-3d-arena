<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06121f" />
  <meta name="description" content="一只鹈鹕骑着自行车穿越潮汐竞技场的实时 3D 互动体验。" />
  <meta property="og:title" content="Pelican Velocity — 潮汐骑行竞技场" />
  <meta property="og:description" content="加速、压弯、腾跃：实时驾驭一只骑自行车的鹈鹕。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./preview-desktop.png" />
  <title>Pelican Velocity — 潮汐骑行竞技场</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" aria-label="鹈鹕骑自行车 3D 互动场景">
    <canvas id="scene" aria-label="实时 3D 场景"></canvas>

    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar glass">
      <a class="brand" href="#" aria-label="Pelican Velocity 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M8 26c8-2 11-11 20-10 5 0 8 3 9 7-5-2-9-1-11 2 5 0 9 2 13 6-9 0-15-1-21-5-3 5-7 7-12 7 2-2 3-4 2-7Z"/><circle cx="30" cy="19" r="1.5"/></svg>
        </span>
        <span><b>PELICAN</b><small>VELOCITY / 3D</small></span>
      </a>
      <div class="top-actions">
        <button id="soundBtn" class="icon-btn" type="button" aria-label="开启声音" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-4v8a4.5 4.5 0 0 0 2-4Zm0-8v2a7 7 0 0 1 0 12v2a9 9 0 0 0 0-16Z"/></svg>
        </button>
        <button id="photoBtn" class="icon-btn" type="button" aria-label="保存场景截图">
          <svg viewBox="0 0 24 24"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 13a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-2a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg>
        </button>
        <button id="panelBtn" class="icon-btn mobile-only" type="button" aria-label="打开控制面板" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h16v2H4V7Zm0 8h16v2H4v-2Z"/></svg>
        </button>
      </div>
    </header>

    <section class="hero-copy" aria-labelledby="pageTitle">
      <p class="eyebrow"><span></span> TIDAL CIRCUIT // LIVE</p>
      <h1 id="pageTitle">飞得不高，<br><em>骑得够快。</em></h1>
      <p class="lede">驾驭一只不甘只会捕鱼的鹈鹕，沿着暮色海岸冲刺、压弯、腾空。</p>
      <button id="rideBtn" class="ride-btn" type="button">
        <span>开始骑行</span>
        <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </section>

    <aside id="controlPanel" class="control-panel glass" aria-label="场景控制台">
      <div class="panel-head">
        <div>
          <span class="panel-kicker">FLIGHT DECK</span>
          <h2>骑行控制台</h2>
        </div>
        <span id="liveState" class="live-dot">LIVE</span>
      </div>

      <div class="telemetry">
        <div class="speed-readout">
          <span id="speedValue">18</span><small>KM/H</small>
        </div>
        <div class="speed-arc" aria-hidden="true"><i id="speedArc"></i></div>
        <div class="telemetry-grid">
          <span>圈速<b id="lapTime">00:00.0</b></span>
          <span>里程<b id="distanceValue">0.00 km</b></span>
          <span>连击<b id="comboValue">×1</b></span>
        </div>
      </div>

      <div class="control-block">
        <div class="control-label"><label for="speedSlider">巡航速度</label><output id="speedOutput">55%</output></div>
        <input id="speedSlider" type="range" min="0" max="100" value="55" />
      </div>

      <div class="control-block">
        <div class="control-label"><label for="sunSlider">太阳高度</label><output id="sunOutput">暮光</output></div>
        <input id="sunSlider" type="range" min="0" max="100" value="34" />
      </div>

      <fieldset class="camera-modes">
        <legend>摄像机</legend>
        <button class="camera-btn active" data-camera="chase" type="button"><span>01</span>追逐</button>
        <button class="camera-btn" data-camera="orbit" type="button"><span>02</span>环绕</button>
        <button class="camera-btn" data-camera="cinema" type="button"><span>03</span>电影</button>
        <button class="camera-btn" data-camera="pov" type="button"><span>04</span>车载</button>
      </fieldset>

      <div class="toggle-row">
        <label class="toggle"><input id="motionToggle" type="checkbox" checked /><span></span>动态效果</label>
        <label class="toggle"><input id="lightsToggle" type="checkbox" checked /><span></span>霓虹灯</label>
      </div>

      <div class="keyboard-help">
        <span><kbd>W</kbd><kbd>S</kbd> 速度</span>
        <span><kbd>A</kbd><kbd>D</kbd> 横移</span>
        <span><kbd>SPACE</kbd> 腾跃</span>
        <span><kbd>C</kbd> 镜头</span>
      </div>
    </aside>

    <div class="status-strip glass" aria-live="polite">
      <span class="compass"><i>N</i><b id="headingValue">072°</b></span>
      <span id="statusText">潮汐赛道已就绪</span>
      <span class="fps"><i></i><b id="fpsValue">60 FPS</b></span>
    </div>

    <div id="boostMeter" class="boost-meter" aria-label="能量推进">
      <span>BOOST</span><div><i></i></div><b>100</b>
    </div>

    <div class="touch-controls" aria-label="触摸控制">
      <div class="touch-steer">
        <button id="leftBtn" type="button" aria-label="向左"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <button id="rightBtn" type="button" aria-label="向右"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <button id="jumpBtn" class="jump-btn" type="button">JUMP</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="loader" class="loader" aria-live="polite">
      <div class="loader-bird" aria-hidden="true">
        <svg viewBox="0 0 120 80"><path d="M9 48c22-5 30-31 54-29 14 1 24 9 27 19-14-5-25-1-31 8 16-1 28 6 42 17-27 1-45-2-62-14-7 13-18 19-33 20 7-6 10-13 3-21Z"/><circle cx="70" cy="28" r="3"/></svg>
      </div>
      <div class="loader-line"><i></i></div>
      <p>正在唤醒潮汐竞技场 <span>0%</span></p>
    </div>

    <noscript>请启用 JavaScript 以运行实时 3D 场景。</noscript>
  </main>

  <script src="./vendor/three.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
